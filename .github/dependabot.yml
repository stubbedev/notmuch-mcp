version: 2

# Dependency auto-bumps. Dependabot opens the PRs, CI (ci.yml) gates them.
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    open-pull-requests-limit: 5
    groups:
      # One PR per week for everything Go, instead of one per module.
      go:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
