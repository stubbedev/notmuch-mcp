name: dependabot-auto-merge

# Merges dependabot PRs once every check on the head commit is green.
#
# Deliberately a schedule and not `workflow_run` / `pull_request_target`:
# dependabot PRs get a read-only GITHUB_TOKEN on `pull_request`, so nothing
# running in the PR's own context can merge them. A scheduled run executes in
# the default-branch context with a write token, so this needs no PAT and no
# ruleset.
#
# The merge itself is a plain `git push` over an SSH deploy key, never
# `gh pr merge`: GITHUB_TOKEN is a GitHub App token, and the API flatly refuses
# to let an App write .github/workflows/** ("refusing to allow a GitHub App to
# create or update workflow ... without `workflows` permission"). No
# `permissions:` key can grant an App that scope.
#
# A github-actions version bump *is* such a write, and nothing this job can
# authenticate as may land it — the deploy key is rejected too ("refusing to
# allow an OAuth App ... without `workflow` scope"). Dependabot can: it authored
# the change. So those PRs are handed back to it with its own merge command,
# which it honours once CI is green.
#
# Whatever CI actually rejects stays open for a human — that is the point.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Never let a dispatched run race a scheduled one onto the default branch.
concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # Rewrites `origin` to SSH and installs the deploy key, so every
          # `git push` below is authenticated as the key rather than as the
          # Actions App. Pushes made this way also trigger the `push` workflows,
          # which GITHUB_TOKEN pushes do not — so CI reruns on the default
          # branch after a merge and re-syncs flake.nix's vendorHash by itself.
          ssh-key: ${{ secrets.AUTOMERGE_SSH_KEY }}

      - name: Merge green dependabot PRs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          prs=$(gh pr list --state open --author "app/dependabot" --json number --jq '.[].number')
          [ -n "$prs" ] || { echo "No open dependabot PRs."; exit 0; }

          base=$(gh repo view --json defaultBranchRef --jq .defaultBranchRef.name)
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          failed=0

          for pr in $prs; do
            # Judge by bucket and ignore "cancel": a cancelled run always has
            # a newer one behind it. ci.yml no longer manufactures cancelled
            # rows (one event per commit), but a force-push during a run still
            # can, and that must not read as failure.
            buckets=$(gh pr checks "$pr" --json bucket --jq '[.[].bucket]|unique|join(",")' 2>/dev/null || echo "none")
            # GitHub computes mergeability lazily, and every push to the base
            # invalidates it — including the merge of the PR before this one.
            # The first query returns UNKNOWN and only kicks the computation
            # off, so poll instead of parking the PR until the next run.
            mergeable=UNKNOWN
            for _ in 1 2 3 4 5 6; do
              mergeable=$(gh pr view "$pr" --json mergeable --jq .mergeable)
              if [ "$mergeable" != "UNKNOWN" ]; then
                break
              fi
              sleep 5
            done

            case "$buckets" in
              *fail*)     echo "#$pr: checks failing ($buckets) — leaving for a human"; continue ;;
              *pending*)  echo "#$pr: checks still running ($buckets)"; continue ;;
              *pass*)     ;;
              *)          echo "#$pr: no passing checks ($buckets) — refusing to merge blind"; continue ;;
            esac

            if [ "$mergeable" != "MERGEABLE" ]; then
              echo "#$pr: not mergeable ($mergeable)"
              continue
            fi

            # .github/workflows/** is unwritable by every credential available
            # here, deploy key included. Ask dependabot to merge its own PR
            # instead; it has the permission because it opened the PR. The
            # command is idempotent-by-check so a six-hourly run does not
            # re-comment while dependabot is still working through it.
            files=$(gh pr view "$pr" --json files --jq '.files[].path')
            case "$files" in
              *".github/workflows/"*)
                comments=$(gh pr view "$pr" --json comments --jq '.comments[].body')
                case "$comments" in
                  *"@dependabot squash and merge"*)
                    echo "#$pr: dependabot already asked to merge — waiting" ;;
                  *)
                    gh pr comment "$pr" --body "@dependabot squash and merge"
                    echo "::notice::#$pr touches .github/workflows/ — handed the merge to dependabot." ;;
                esac
                continue ;;
            esac

            head_sha=$(gh pr view "$pr" --json headRefOid --jq .headRefOid)
            head_ref=$(gh pr view "$pr" --json headRefName --jq .headRefName)
            title=$(gh pr view "$pr" --json title --jq .title)

            # Two attempts: an earlier PR in this same loop (or a CI auto-commit)
            # may have moved the branch under us, which a second pass resolves.
            merged=0
            for attempt in 1 2; do
              git fetch -q origin "$base" "refs/pull/$pr/head" || true
              git checkout -q -B "$base" "origin/$base"

              if git merge-base --is-ancestor "origin/$base" "$head_sha"; then
                # Dependabot rebases its branches, so the head is normally a
                # fast-forward. Pushing it untouched keeps history linear and
                # leaves the PR marked *Merged* rather than merely closed,
                # because its own commits become reachable from the base.
                push_ref=$head_sha
              elif git merge -q --squash "$head_sha"; then
                git commit -q -m "$title (#$pr)" -m "Closes #$pr"
                push_ref=HEAD
              else
                # Only reachable if the base moved since the mergeable check.
                git merge --abort || true
                git reset -q --hard "origin/$base"
                echo "#$pr: conflicts with $base — dependabot will rebase it"
                merged=skip
                break
              fi

              if git push -q origin "$push_ref:refs/heads/$base"; then
                merged=1
                break
              fi
              echo "#$pr: push to $base rejected (attempt $attempt) — refetching"
            done

            # A conflict is dependabot's to resolve by rebasing, not a failure.
            if [ "$merged" = "skip" ]; then
              continue
            fi

            if [ "$merged" != "1" ]; then
              echo "::error::#$pr: could not push the merge to $base"
              failed=1
              continue
            fi

            # Dependabot deletes its own branch once the PR is merged, but not
            # when the squash fallback merely closed it. Tolerate either state.
            git push -q origin --delete "$head_ref" 2>/dev/null || true
            echo "::notice::Auto-merged dependabot PR #$pr ($buckets)."
          done

          exit "$failed"
